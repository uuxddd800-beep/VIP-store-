<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>VIP Store</title>
<style>
/* ===== БАЗА (iOS 6) ===== */
body{background:#1a1a1a;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;margin:0;padding:0;color:#fff;transition:background .4s,color .4s}
.header{background:linear-gradient(#4a4a4a,#2a2a2a);padding:10px;text-align:center;border-bottom:1px solid #000;position:relative}
.header h1{margin:0;font-size:20px;font-weight:bold;color:#fff;text-shadow:0 -1px 0 #000}
.settings-btn{position:absolute;right:10px;top:10px;background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
.section-title{font-size:16px;font-weight:bold;color:#ffcc00;padding:15px 10px 5px 10px;text-shadow:0 -1px 0 #000}
.search-box{width:100%;padding:10px;border-radius:8px;border:1px solid #555;background:#222;color:#fff;font-size:14px;box-sizing:border-box;margin:10px}
.app-list{padding:0 10px}
.app-item{background:linear-gradient(#3a3a3a,#2a2a2a);border:1px solid #000;border-radius:10px;padding:12px;margin-bottom:12px;display:flex;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 4px rgba(0,0,0,.5);cursor:pointer;animation:slideUp .4s ease-out}
.app-item:active{background:linear-gradient(#2a2a2a,#1a1a1a);transform:scale(.97);transition:transform .1s}
.app-icon-small{width:50px;height:50px;border-radius:10px;margin-right:12px;background:#555;border:1px solid #000;flex-shrink:0;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.app-name-small{font-size:16px;font-weight:bold;color:#fff;text-shadow:0 -1px 0 #000}
.app-detail{display:none;padding:15px;animation:fadeIn .3s ease-out}
.detail-header{display:flex;align-items:center;margin-bottom:15px}
.detail-icon{width:80px;height:80px;border-radius:16px;margin-right:15px;background:#555;border:1px solid #000;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.detail-info{flex:1}
.detail-name{font-size:22px;font-weight:bold;color:#fff;text-shadow:0 -1px 0 #000;margin-bottom:5px}
.detail-desc{font-size:14px;color:#aaa;margin-bottom:10px}
.detail-download{background:linear-gradient(#5ac8fa,#007aff);color:#fff;border:1px solid #003366;border-radius:18px;padding:12px 24px;font-size:16px;font-weight:bold;text-decoration:none;display:inline-block;text-shadow:0 -1px 0 rgba(0,0,0,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 4px rgba(0,0,0,.4);margin-top:10px;animation:pulse 2s infinite}
.detail-download:active{background:linear-gradient(#007aff,#0055cc)}
.back-btn{background:linear-gradient(#5ac8fa,#007aff);color:#fff;border:1px solid #003366;border-radius:12px;padding:8px 16px;font-size:14px;font-weight:bold;cursor:pointer;text-shadow:0 -1px 0 rgba(0,0,0,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);margin-bottom:15px}
.back-btn:active{background:linear-gradient(#007aff,#0055cc)}
.stars{display:flex;gap:4px;font-size:24px;margin-bottom:10px}
.star{cursor:pointer;color:#555}
.star.active{color:#ffcc00;text-shadow:0 0 6px #ffcc00}
.reviews{margin-top:15px;border-top:1px solid #444;padding-top:10px}
.review{font-size:13px;color:#ccc;margin-bottom:6px;padding:6px;background:rgba(0,0,0,.3);border-radius:6px}
.review-input{width:100%;padding:8px;border-radius:6px;border:1px solid #555;background:#222;color:#fff;font-size:13px;margin-bottom:6px;box-sizing:border-box}
.review-submit{background:linear-gradient(#5ac8fa,#007aff);color:#fff;border:1px solid #003366;border-radius:12px;padding:8px 16px;font-size:13px;font-weight:bold;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.recommended{padding:0 15px 15px 15px;border-top:1px solid #444;margin-top:20px}
.recommended h2{font-size:18px;color:#ffcc00;text-shadow:0 -1px 0 #000;margin-bottom:10px}
.recommended-item{display:flex;align-items:center;margin-bottom:10px;cursor:pointer}
.recommended-icon{width:40px;height:40px;border-radius:8px;margin-right:10px;background:#555;border:1px solid #000}
.recommended-name{font-size:14px;color:#fff}
.footer{background:linear-gradient(#2a2a2a,#1a1a1a);padding:10px;text-align:center;font-size:11px;color:#666;border-top:1px solid #000;margin-top:20px}

/* ===== АНИМАЦИИ ===== */
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(90,200,250,.7)}70%{box-shadow:0 0 0 10px rgba(90,200,250,0)}100%{box-shadow:0 0 0 0 rgba(90,200,250,0)}}

/* ===== СВЕТЛАЯ ТЕМА ===== */
body.light{background:#f2f2f7;color:#000}
body.light .header{background:linear-gradient(#e0e0e0,#c0c0c0)}
body.light .header h1{color:#000;text-shadow:none}
body.light .app-item{background:linear-gradient(#fff,#f0f0f0);border:1px solid #ccc}
body.light .app-name-small,body.light .detail-name,body.light .recommended-name{color:#000;text-shadow:none}
body.light .footer{background:linear-gradient(#e0e0e0,#c0c0c0);color:#333}
body.light .settings-btn,body.light .section-title{color:#007aff;text-shadow:none}
body.light .review{background:rgba(0,0,0,.1);color:#333}
body.light .review-input{background:#fff;color:#000;border:1px solid #ccc}
body.light .search-box{background:#fff;color:#000;border:1px solid #ccc}

/* ===== iOS 7 ===== */
body.ios7{background:#f2f2f7;color:#000;font-weight:300}
body.ios7 .header{background:#f8f8f8;border-bottom:1px solid #c8c7cc;padding:12px}
body.ios7 .header h1{color:#000;text-shadow:none;font-weight:300;font-size:18px}
body.ios7 .settings-btn{color:#007aff}
body.ios7 .section-title{color:#007aff;text-shadow:none;font-weight:300;font-size:14px;text-transform:uppercase}
body.ios7 .app-item{background:#fff;border:none;border-radius:0;box-shadow:none;border-bottom:1px solid #e5e5ea;padding:14px}
body.ios7 .app-item:active{background:#e5e5ea}
body.ios7 .app-name-small{color:#000;text-shadow:none;font-weight:300;font-size:17px}
body.ios7 .app-icon-small{border-radius:22.5%;border:none;box-shadow:none}
body.ios7 .detail-name{color:#000;text-shadow:none;font-weight:300}
body.ios7 .detail-desc{color:#8e8e93;font-weight:300}
body.ios7 .detail-download{background:#007aff;border:none;border-radius:8px;padding:12px 24px;font-weight:300;box-shadow:none}
body.ios7 .back-btn{background:none;border:none;color:#007aff;box-shadow:none;font-weight:300;padding:8px 0;font-size:17px}
body.ios7 .footer{background:#f8f8f8;color:#8e8e93;border-top:1px solid #c8c7cc;font-weight:300}
body.ios7 .recommended h2{color:#007aff;text-shadow:none;font-weight:300}
body.ios7 .recommended-name{color:#000;font-weight:300}
body.ios7 .review{background:#f2f2f7;color:#000;font-weight:300}
body.ios7 .review-input{background:#fff;color:#000;border:1px solid #c8c7cc;font-weight:300}
body.ios7 .review-submit{background:#007aff;border:none;border-radius:8px;font-weight:300}
body.ios7 .stars .star{color:#c8c7cc}
body.ios7 .stars .star.active{color:#ff9500;text-shadow:none}
body.ios7 .search-box{background:#fff;color:#000;border:1px solid #c8c7cc;font-weight:300}

/* ===== FRUTIGER AERO ===== */
body.aero{background:linear-gradient(135deg,#a8e6cf 0%,#dcedc1 50%,#c8e6c9 100%);color:#1b5e20;font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif}
body.aero .header{background:rgba(255,255,255,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.7);box-shadow:0 2px 12px rgba(27,94,32,.15)}
body.aero .header h1{color:#1b5e20;text-shadow:0 1px 0 rgba(255,255,255,.8)}
body.aero .settings-btn{color:#1b5e20}
body.aero .section-title{color:#2e7d32;text-shadow:0 1px 0 rgba(255,255,255,.8)}
body.aero .app-item{background:rgba(255,255,255,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.8);border-radius:14px;box-shadow:0 4px 14px rgba(27,94,32,.12),inset 0 1px 0 rgba(255,255,255,.9)}
body.aero .app-item:active{background:rgba(255,255,255,.65)}
body.aero .app-name-small{color:#1b5e20;text-shadow:0 1px 0 rgba(255,255,255,.8)}
body.aero .app-icon-small{border-radius:14px;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(27,94,32,.2)}
body.aero .detail-name{color:#1b5e20;text-shadow:0 1px 0 rgba(255,255,255,.8)}
body.aero .detail-desc{color:#2e7d32}
body.aero .detail-download{background:linear-gradient(rgba(255,255,255,.5),rgba(200,230,201,.5));border:1px solid rgba(255,255,255,.9);color:#1b5e20;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);box-shadow:0 2px 10px rgba(27,94,32,.15),inset 0 1px 0 rgba(255,255,255,.9)}
body.aero .back-btn{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);color:#1b5e20;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
body.aero .footer{background:rgba(255,255,255,.35);color:#2e7d32;border-top:1px solid rgba(255,255,255,.8);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
body.aero .recommended h2{color:#2e7d32;text-shadow:0 1px 0 rgba(255,255,255,.8)}
body.aero .recommended-name{color:#1b5e20}

body.aero .review-input{background:rgba(255,255,255,.7);color:#1b5e20;border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}

body.aero .search-box{background:rgba(255,255,255,.7);color:#1b5e20;border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
</style>
</head>

// ===== ФУНКЦИИ =====
function openApp(id){document.getElementById('main-page').style.display='none';var d=document.getElementById('detail-'+id);d.style.display='block';d.style.animation='none';setTimeout(function(){d.style.animation=''},10)}
function goBack(){var d=document.querySelectorAll('.app-detail');for(var i=0;i<d.length;i++)d[i].style.display='none';document.getElementById('main-page').style.display='block'}
function openSettings(){document.getElementById('main-page').style.display='none';document.getElementById('settings-page').style.display='block'}
function setTheme(t){document.body.className=t;localStorage.setItem('theme',t)}
var s=localStorage.getItem('theme');if(s)setTheme(s);

// ===== ПОИСК =====
function searchGames(){
    var q=document.getElementById('search').value.toLowerCase();
    var items=document.querySelectorAll('.app-item');
    for(var i=0;i<items.length;i++){
        var n=items[i].querySelector('.app-name-small').textContent.toLowerCase();
        items[i].style.display=n.indexOf(q)!==-1?'flex':'none';
    }
}

// ===== СОЗДАНИЕ КАРТОЧЕК И СТРАНИЦ =====
window.onload=function(){
    var list=document.getElementById('app-list');
    var rec=document.getElementById('recommended-list');
    var details=document.getElementById('details-container');
    var html='';
    var recHtml='';
    var detHtml='';
    
    for(var i=0;i<games.length;i++){
        var g=games[i];
        // Карточка
        html+='<div class="app-item" onclick="openApp(\''+g.id+'\')"><img class="app-icon-small" src="'+g.icon+'"><div class="app-name-small">'+g.name+'</div></div>';
        // Рекомендуемое
        recHtml+='<div class="recommended-item" onclick="openApp(\''+g.id+'\')"><img class="recommended-icon" src="'+g.icon+'"><div class="recommended-name">'+g.name+'</div></div>';
        // Страница
        detHtml+='<div id="detail-'+g.id+'" class="app-detail"><button class="back-btn" onclick="goBack()">← Назад</button><div class="detail-header"><img class="detail-icon" src="'+g.icon+'"><div class="detail-info"><div class="detail-name">'+g.name+'</div><div class="detail-desc">'+g.desc+'</div></div></div><div class="stars" data-app="'+g.id+'"><span class="star" data-value="1">★</span><span class="star" data-value="2">★</span><span class="star" data-value="3">★</span><span class="star" data-value="4">★</span><span class="star" data-value="5">★</span></div><a href="'+g.ipa+'" class="detail-download">Скачать</a><div class="reviews" id="reviews-'+g.id+'"><input type="text" class="review-input" placeholder="Напиши отзыв..." data-app="'+g.id+'"><button class="review-submit" data-app="'+g.id+'">Отправить</button></div></div>';
    }
    
    list.innerHTML=html;
    rec.innerHTML=recHtml;
    details.innerHTML=detHtml;
    
    // Инициализация звёзд и отзывов
    initStars();
    initReviews();
};

function initStars(){
    var sc=document.querySelectorAll('.stars');
    for(var i=0;i<sc.length;i++){
        (function(c){
            var a=c.getAttribute('data-app');
            var s=c.querySelectorAll('.star');
            for(var j=0;j<s.length;j++){
                (function(st){
                    st.onclick=function(){
                        var v=parseInt(st.getAttribute('data-value'),10);
                        localStorage.setItem('rating_'+a,v);
                        for(var k=0;k<s.length;k++){
                            if(parseInt(s[k].getAttribute('data-value'),10)<=v)s[k].className='star active';
                            else s[k].className='star';
                        }
                    };
                })(s[j]);
            }
            var sr=localStorage.getItem('rating_'+a);
            if(sr){for(var k=0;k<s.length;k++){if(parseInt(s[k].getAttribute('data-value'),10)<=parseInt(sr,10))s[k].className='star active';}}
        })(sc[i]);
    }
}

function initReviews(){
    var rb=document.querySelectorAll('.review-submit');
    for(var i=0;i<rb.length;i++){
        (function(b){
            b.onclick=function(){
                var a=b.getAttribute('data-app');
                var inp=document.querySelector('.review-input[data-app="'+a+'"]');
                var t=inp.value.replace(/^\s+|\s+$/g,'');
                if(t==='')return;
                var r=JSON.parse(localStorage.getItem('reviews_'+a)||'[]');
                r.push(t);
                localStorage.setItem('reviews_'+a,JSON.stringify(r));
                inp.value='';
                renderReviews(a);
            };
        })(rb[i]);
    }
    var rc=document.querySelectorAll('.reviews');
    for(var i=0;i<rc.length;i++){
        var a=rc[i].id.replace('reviews-','');
        renderReviews(a);
    }
}

function renderReviews(a){
    var c=document.getElementById('reviews-'+a);
    if(!c)return;
    var o=c.querySelectorAll('.review');
    for(var i=0;i<o.length;i++)o[i].parentNode.removeChild(o[i]);
    var r=JSON.parse(localStorage.getItem('reviews_'+a)||'[]');
    for(var i=r.length-1;i>=0;i--){
        var e=document.createElement('div');
        e.className='review';
        e.textContent='💬 '+r[i];
        c.insertBefore(e,c.firstChild);
    }
}
</script>

<div class="recommended"><h2>Рекомендуем</h2><div id="recommended-list"></div></div>
<div class="footer">VIP Store для iOS 3+ • Все приложения с Archive.org</div>
</div>

<div id="settings-page" class="app-detail">
